# Supabase local dev config. `supabase start` boots Postgres+PostGIS, Auth,
# Storage, and the Edge runtime locally. Run `supabase db reset` to apply
# everything in supabase/migrations and supabase/seed.sql.
project_id = "lynkkii"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "lynkkii://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true

[functions.feed]
verify_jwt = false
